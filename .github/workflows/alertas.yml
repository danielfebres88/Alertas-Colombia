name: Alertas noticias Colombia

# Cuándo corre
on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (hora UTC; el intervalo es igual en cualquier zona)
  workflow_dispatch:          # permite dispararlo a mano desde la pestaña "Actions" para probar

# Permiso para que el workflow pueda guardar el archivo de estado en el repo
permissions:
  contents: write

# Evita que dos ejecuciones se pisen si una se demora
concurrency:
  group: alertas
  cancel-in-progress: false

jobs:
  alertas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar el script de alertas
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN:     ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alertas_colombia.py

      - name: Guardar el estado (para no repetir alertas)
        run: |
          git config user.name  "alertas-bot"
          git config user.email "alertas-bot@users.noreply.github.com"
          git add alertas_estado.json
          git commit -m "Actualiza estado de alertas" || echo "Sin cambios que guardar"
          git push || echo "Nada que subir"
